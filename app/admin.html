<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理面板 · PigeonLib</title>
  <link rel="icon" type="image/svg+xml" href="/brand-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/home.css">
  <link rel="stylesheet" href="/src/styles/admin.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/index.html" aria-label="PigeonLib 首页">
      <img src="/brand-logo.svg" alt="" class="brand-logo">
      <span>PigeonLib</span>
    </a>
    <nav class="site-nav" id="siteNav" aria-label="导航">
      <a href="/index.html">返回首页</a>
    </nav>
    <div class="account-slot" id="accountSlot"></div>
    <button class="theme-btn" type="button" data-action="toggle-theme" title="切换主题" aria-label="切换主题"><span data-icon="theme" aria-hidden="true"></span></button>
  </header>

  <main class="page-shell">
    <section class="section-block" aria-labelledby="adminTitle">
      <div class="section-heading">
        <p class="section-kicker">管理面板</p>
        <h2 id="adminTitle">用户与同步管理</h2>
      </div>
      <div id="adminGate" class="admin-gate"></div>
      <div id="adminBody" hidden>
        <div class="admin-stats" id="adminStats"></div>
        <div class="admin-table-wrap">
          <table class="admin-table" id="adminUsers"></table>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main-admin.js"></script>
</body>
</html>
