<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理面板 · PigeonLib</title>
  <link rel="icon" type="image/svg+xml" href="/brand-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/home.css">
  <link rel="stylesheet" href="/src/styles/admin.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/index.html" aria-label="PigeonLib 首页">
      <img src="/brand-logo.svg" alt="" class="brand-logo">
      <span>PigeonLib</span>
    </a>
    <nav class="site-nav" id="siteNav" aria-label="导航">
      <a href="/index.html">返回首页</a>
    </nav>
    <div class="account-slot" id="accountSlot"></div>
    <button class="theme-btn" type="button" data-action="toggle-theme" title="切换主题" aria-label="切换主题"><span data-icon="theme" aria-hidden="true"></span></button>
  </header>

  <main class="page-shell">
    <section class="section-block" aria-labelledby="adminTitle">
      <div class="section-heading">
        <p class="section-kicker">管理面板</p>
        <h2 id="adminTitle">用户与同步管理</h2>
      </div>

      <div id="adminGate" class="admin-gate"></div>

      <div id="adminBody" hidden>
        <!-- KPI 概览条 -->
        <div class="admin-stats" id="adminStats"></div>

        <!-- 趋势:双 sparkline -->
        <div class="admin-trends" id="adminTrends"></div>

        <!-- 两栏:课程分析 | 有效会话 -->
        <div class="admin-cols">
          <section class="admin-card">
            <div class="admin-card-head">
              <h3>课程分析</h3>
              <span class="admin-card-sub" id="adminCoursesSub"></span>
            </div>
            <div class="admin-card-body" id="adminCourses"></div>
          </section>
          <section class="admin-card">
            <div class="admin-card-head">
              <h3>有效会话</h3>
              <span class="admin-card-sub" id="adminSessionsSub"></span>
            </div>
            <div class="admin-card-body" id="adminSessions"></div>
          </section>
        </div>

        <!-- 课程审核:待审队列 -->
        <section class="admin-card">
          <div class="admin-card-head">
            <h3>课程审核 · 待审队列</h3>
            <span class="admin-card-sub" id="adminPendingSub"></span>
          </div>
          <div class="admin-card-body" id="adminPending"></div>
        </section>

        <!-- 全部课程(可预览 / 下架) -->
        <section class="admin-card">
          <div class="admin-card-head">
            <h3>全部课程</h3>
            <span class="admin-card-sub" id="adminAllCoursesSub"></span>
          </div>
          <div class="admin-card-body" id="adminAllCourses"></div>
        </section>

        <!-- 用户控制台 -->
        <section class="admin-card admin-console">
          <div class="admin-card-head admin-console-head">
            <h3>用户</h3>
            <div class="admin-toolbar" id="adminToolbar"></div>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table" id="adminUsers"></table>
          </div>
          <div class="admin-pager" id="adminPager"></div>
        </section>

        <!-- 审计日志 -->
        <section class="admin-card">
          <div class="admin-card-head">
            <h3>审计日志</h3>
            <span class="admin-card-sub" id="adminAuditSub"></span>
          </div>
          <div class="admin-card-body" id="adminAudit"></div>
        </section>
      </div>
    </section>
  </main>

  <!-- 单用户下钻抽屉 -->
  <div class="admin-overlay" id="drawerOverlay" hidden></div>
  <aside class="admin-drawer" id="adminDrawer" hidden aria-label="用户详情" tabindex="-1"></aside>

  <!-- 建号弹窗 -->
  <div class="admin-overlay" id="modalOverlay" hidden>
    <div class="admin-modal" id="adminModal" role="dialog" aria-modal="true" aria-label="新建用户"></div>
  </div>

  <script type="module" src="/src/main-admin.js"></script>
</body>
</html>
